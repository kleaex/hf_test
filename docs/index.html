<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="文芸同人誌即売会システムの実験用カタログ。すべて架空の情報です。">
  <title>俳句フリマ｜実験カタログ</title>
  <link rel="stylesheet" href="./styles.css">
  <script src="./connection.js"></script>
  <script src="./rpc.js"></script>
  <script src="./app.js" type="module"></script>
</head>
<body>
  <header><p class="eyebrow">KLEA / EXPERIMENT</p><h1 id="eventTitle">俳句フリマ実験</h1>
    <p id="catalogNotice" class="notice">実験用：掲載情報はすべて架空です。開催・出店募集は行っていません。</p>
  </header>
  <main>
    <section aria-labelledby="catalog-title">
      <p id="publicationInfo" class="meta"></p>
      <p id="eventInfo" class="meta"></p>
      <div class="filters">
        <label for="search">キーワード<input id="search" type="search" placeholder="出店名・作品名・紹介文" maxlength="200"></label>
        <label for="genre">ジャンル<select id="genre"><option value="">すべて</option></select></label>
      </div>
      <p id="status" role="status" aria-live="polite">カタログを読み込んでいます。</p>
      <div id="catalog" class="catalog"></div>
    </section>
  </main>
  <footer>実験段階：公開対象の保存内容を表示します。実際の出店申込は受け付けていません。<br><a href="./exhibitor/">実験用の出店者登録・ログイン</a> ／ <a href="./admin/">運営ログイン</a></footer>
</body>
</html>
