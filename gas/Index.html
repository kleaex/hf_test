<!doctype html>
<html lang="ja">
<head><base target="_top"><meta name="viewport" content="width=device-width, initial-scale=1"><title>接続確認</title></head>
<body style="font-family:sans-serif;max-width:640px;margin:3rem auto;padding:1rem;line-height:1.8">
<h1>出店者画面の接続確認</h1>
<p>実験用です。申込・ログイン・情報保存・画像アップロードはまだ利用できません。</p>
<button id="check" type="button" style="font:inherit;padding:.5rem 1rem">GASへの接続を確認</button>
<p id="result" role="status" aria-live="polite"></p>
<script>
document.getElementById('check').addEventListener('click', function () {
  const button = this;
  const result = document.getElementById('result');
  button.disabled = true;
  result.textContent = '確認しています。';
  google.script.run.withSuccessHandler(function (data) {
    result.textContent = data.ok ? 'GASに接続できました。保存先・認証は未接続です。' : '接続を確認できませんでした。';
    button.disabled = false;
  }).withFailureHandler(function () {
    result.textContent = '接続に失敗しました。もう一度お試しください。';
    button.disabled = false;
  }).getSystemStatus();
});
</script>
</body>
</html>
