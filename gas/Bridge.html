<!doctype html><html><head><meta charset="utf-8"></head><body>
<script>
'use strict';
const settings = <?!= settings ?>;
const methods = new Set(['getSystemStatus', 'getPublicCatalog', 'getPublicImage', 'getPublicImages',
  'requestRegistrationCode', 'verifyRegistrationCode', 'requestExhibitorLoginCode', 'verifyExhibitorLoginCode',
  'requestLoginCode', 'verifyLoginCode', 'getMyProfile', 'saveProfile', 'stagePublicationImage', 'getPublicationImage', 'logout',
  'requestAdminLoginCode', 'verifyAdminLoginCode', 'getAdminDashboard', 'saveAdminEvent', 'getAdminImage', 'logoutAdmin']);
const active = new Set();
window.addEventListener('message', event => {
  const message = event.data;
  if (event.source !== window.top || event.origin !== settings.origin || !message
      || message.channel !== 'hf-rpc-v1' || message.nonce !== settings.nonce
      || typeof message.id !== 'string' || !/^[a-f0-9]{32}$/.test(message.id)
      || !methods.has(message.method) || !Array.isArray(message.args) || message.args.length > 3
      || active.has(message.id) || active.size >= 8) return;
  active.add(message.id);
  const reply = result => {
    if (!active.delete(message.id)) return;
    window.top.postMessage({ channel: 'hf-rpc-v1', nonce: settings.nonce, id: message.id, result: result }, settings.origin);
  };
  google.script.run.withSuccessHandler(reply).withFailureHandler(() => reply({ ok: false,
    error: { code: 'UNAVAILABLE', message: '処理結果を確認できませんでした。同じ操作を再試行してください。' } }))[message.method](...message.args);
});
const ready = { channel: 'hf-rpc-v1', nonce: settings.nonce, ready: true };
if (Object.prototype.hasOwnProperty.call(settings, 'initialCatalog')) ready.initialCatalog = settings.initialCatalog;
window.top.postMessage(ready, settings.origin);
</script></body></html>
